name: Create and upload wheels

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TESTPYPI_PASSWORD:
        required: true

jobs:
  build_wheels_sdist:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"

#          - os: macos-latest
#            python-version: "3.12"
#
#          - os: windows-latest
#            python-version: "3.12"

    steps:

      - uses: actions/checkout@v5

      - name: Install OS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -yy
          sudo apt-get install -yy \
              libgl1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools build setuptools wheel numpy
          python -m pip install cython
          python -m pip install cibuildwheel

      - name: Install Qt
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install Pyside6 
          #PyQt5==5.14.1

      - name: Install Qt
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m pip install Pyside6==6.9.1

      - name: Set environment for 10.13 compatibility
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> $GITHUB_ENV
          echo "CFLAGS=-mmacosx-version-min=10.13" >> $GITHUB_ENV
          echo "LDFLAGS=-mmacosx-version-min=10.13" >> $GITHUB_ENV

      # Build source distribution only on Linux
      - name: Build source distribution (sdist)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m build --sdist --outdir dist
          ls dist

      # Build wheels using cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          # Python versions
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # MacOS: only universal2
          CIBW_ARCHS_MACOS: universal2
          # Linux: only x86_64
          CIBW_ARCHS_LINUX: x86_64
          # Windows: only 64-bit (win_amd64)
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_SKIP: "*-musllinux*"

      - name: Show output files
        run: ls dist

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: dist/*.whl
          retention-days: 1

      - name: Upload wheel as artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Linux-sdist
          path: dist/*.tar.gz
          retention-days: 1


  test_sdist:
    runs-on: ubuntu-latest
    needs: build_wheels_sdist
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:

      - uses: actions/checkout@v5

      - name: Install OS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -yy
          sudo apt-get install -yy \
              libgl1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools build setuptools wheel cython numpy
          python -m pip install silx

      - name: Install Qt
        run: |
          python -m pip install Pyside6 
          #PyQt5==5.14.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-sdist
          path: dist

      - name: Install
        run: |
          pip install --pre "$(ls dist/*test-5.*)"
    #          pip install --pre "$(ls dist/*ca5-5.*)"

      - name: Run the tests
        run: |
          cd ..
          xvfb-run -a python -m PyMca5.tests.TestAll

  test_wheels:
    runs-on: ${{ matrix.os }}
    needs: build_wheels_sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ] #, windows-latest, macos-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v5

      - name: Install OS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -yy
          sudo apt-get install -yy \
              libgl1-mesa-dev
#              libegl-mesa0 \
#              libglx-mesa0 \
#              libxkbcommon-x11-0 \
#              libxkbcommon0 \
#              libxcb-icccm4 \
#              libxcb-image0 \
#              libxcb-shm0 \
#              libxcb-keysyms1 \
#              libxcb-randr0 \
#              libxcb-render-util0 \
#              libxcb-render0 \
#              libxcb-shape0 \
#              libxcb-sync1 \
#              libxcb-xfixes0 \
#              libxcb-xinerama0 \
#              libxcb-xkb1 \
#              libxcb1
#          export DISPLAY=:99.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install silx
          python -m pip install PyOpenGL

      - name: Install Qt
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install Pyside6
          #PyQt5==5.14.1

      - name: Install Qt
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m pip install Pyside6==6.9.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels
          path: dist

      - name: Install correct wheel
        shell: bash
        id: install_wheel
        run: |
          pv="${{ matrix.python-version }}"
          PYTAG="cp${pv//./}"
          case "${{ matrix.os }}" in
            ubuntu-latest)
              PLATFORM_TAG="manylinux"
              ;;
            windows-latest)
              PLATFORM_TAG="win"
              ;;
            macos-latest)
              PLATFORM_TAG="macosx"
              ;;
            *)
              echo "Unsupported OS: ${{ matrix.os }}"
              exit 1
              ;;
          esac
      
          echo "wheel tag: $PYTAG + $PLATFORM_TAG"
          WHL_PATH=$(find dist -name "*${PYTAG}*${PLATFORM_TAG}*.whl" | head -n 1)
      
          if [[ -z "$WHL_PATH" ]]; then
            echo "❌ No matching wheel found for $PYTAG + $PLATFORM_TAG"
            exit 1
          fi
      
          echo "✅ Installing: $WHL_PATH"
          pip install "$WHL_PATH"
          
          # Set output for the step
          echo "wheel-path=$WHL_PATH" >> $GITHUB_OUTPUT

      - name: Run the tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ..
          xvfb-run -a python -m PyMca5.tests.TestAll

      - name: Run the tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          cd ..
          python -m PyMca5.tests.TestAll

      - name: Run extra x86 tests
        if: matrix.os == 'macos-latest'
        run: |
          arch -x86_64 python -m venv venv-x86
          chmod +x venv-x86/bin/python
          source venv-x86/bin/activate
          arch -x86_64 python -m pip install Pyside6
          arch -x86_64 python -m pip install silx
          arch -x86_64 python -m pip install --pre ${{ steps.install_wheel.outputs.wheel-path }}
          cd ..
          arch -x86_64 python -m PyMca5.tests.TestAll

  upload_to_testpypi:
    name: Upload all wheels to TestPyPI
    runs-on: macos-latest
    needs:
      - test_wheels
      - test_sdist
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-latest-wheels
          path: dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-latest-wheels
          path: dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-sdist
          path: dist

      - name: List all downloaded files
        run: ls -R dist

      - name: Upgrade
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      - name: List files to be uploaded
        run: |
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \)

      - name: Upload wheels to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_PASSWORD }}
        run: |
          files=$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \))
          echo "Uploading files:"
          echo "$files"
          python -m twine upload --verbose --repository testpypi $files