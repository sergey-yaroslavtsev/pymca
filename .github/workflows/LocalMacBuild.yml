name: Wheels and build for MacOS

on:
  workflow_dispatch:

jobs:
  build_and_test:
    name: "Python ${{ matrix.python-version }} on MacOS ${{ matrix.MacOS_TARGET }}"
    runs-on: macos-latest
    strategy:
      # do not cancel tests after first fail
      fail-fast: false
      matrix:
        include:

#          - name-suffix: "not specified PySide6 wheel"
#            os: macos-latest
#            python-version: "3.12"
#            BUILD_COMMAND: --wheel
#            ARCH_COMMAND: ""
#            SOURCE: ""
#            QT_BINDING: PySide6

          - python-version: "3.12"
            BUILD_COMMAND: --wheel
            ARCH_COMMAND: "arch -x86_64"
            SOURCE: "source venv-x86/bin/activate"
            QT_BINDING: PySide6
            MacOS_TARGET: 10.13

#          - python-version: "3.12"
#            BUILD_COMMAND: --wheel
#            ARCH_COMMAND: "arch -arm64"
#            SOURCE: "source venv-arm64/bin/activate"
#            QT_BINDING: PySide6
#            MacOS_TARGET: 10.13

          - python-version: "3.12"
            BUILD_COMMAND: --wheel
            ARCH_COMMAND: "arch -arm64"
            SOURCE: "source venv-arm64/bin/activate"
            QT_BINDING: PySide6
            MacOS_TARGET: 11

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # to "castrate" interpreter to be sure it is run on required architecture
      - name: Setup MacOS x86_64 Python
        if: matrix.ARCH_COMMAND == 'arch -x86_64'
        run: |
          arch -x86_64 python -m venv venv-x86
          lipo venv-x86/bin/python -remove arm64 -output venv-x86/bin/python_x86
          sudo mv venv-x86/bin/python_x86 venv-x86/bin/python
          chmod +x venv-x86/bin/python
          file venv-x86/bin/python
          source venv-x86/bin/activate

      # to "castrate" interpreter to be sure it is run on required architecture
      - name: Setup MacOS arm64 Python
        if: matrix.ARCH_COMMAND == 'arch -arm64'
        run: |
          arch -arm64 python -m venv venv-arm64
          lipo venv-arm64/bin/python -remove x86_64 -output venv-arm64/bin/python_arm64
          sudo mv venv-arm64/bin/python_arm64 venv-arm64/bin/python
          chmod +x venv-arm64/bin/python
          file venv-arm64/bin/python
          source venv-arm64/bin/activate


      - name: Upgrade distribution modules and install build dependencies
        run: |
          ${{ matrix.SOURCE }}
          ${{ matrix.ARCH_COMMAND }} python -m pip install --upgrade pip
          ${{ matrix.ARCH_COMMAND }} pip install --upgrade setuptools wheel cython
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          ${{ matrix.ARCH_COMMAND }} pip install --upgrade wheel
          ${{ matrix.ARCH_COMMAND }} pip install --upgrade numpy
          ${{ matrix.ARCH_COMMAND }} pip install --upgrade build
          ${{ matrix.ARCH_COMMAND }} pip install cython
          # ${{ matrix.ARCH_COMMAND }} pip install silx --pre --find-links https://silx.gitlab-pages.esrf.fr/bob/silx/
          ${{ matrix.ARCH_COMMAND }} pip install ${{ matrix.QT_BINDING }}

      - name: Print python info
        run: |
          ${{ matrix.SOURCE }}
          ${{ matrix.ARCH_COMMAND }} python ./ci/info_platform.py
          ${{ matrix.ARCH_COMMAND }} pip list

      - name: Set environment for ${{ matrix.MacOS_TARGET }} compatibility
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.MacOS_TARGET }}" >> $GITHUB_ENV
          echo "CFLAGS=-mmacosx-version-min=${{ matrix.MacOS_TARGET }}" >> $GITHUB_ENV
          echo "LDFLAGS=-mmacosx-version-min=${{ matrix.MacOS_TARGET }}" >> $GITHUB_ENV

      - name: Generate source package or wheel
        run: |
          ${{ matrix.SOURCE }}
          ${{ matrix.ARCH_COMMAND }} python -m build ${{ matrix.BUILD_COMMAND }}
          ls dist

      - name: Rename wheels universal to arm64
        if: matrix.ARCH_COMMAND == 'arch -arm64'
        run: |
          for file in dist/*.whl; do
            base=$(basename "$file")
            newname="${base/_universal2/_arm64}"
            sudo mv "$file" "dist/$newname"
          done
          ls dist

      - name: Rename wheels universal to x86
        if: matrix.ARCH_COMMAND == 'arch -x86_64'
        run: |
          for file in dist/*.whl; do
            base=$(basename "$file")
            newname="${base/_universal2/_x86_64}"
            sudo mv "$file" "dist/$newname"
          done
          ls dist

      - name: Install
        run: |
          ${{ matrix.SOURCE }}
          ${{ matrix.ARCH_COMMAND }} pip install --pre "$(ls dist/*test-5.*)"
#          pip install --pre "$(ls dist/*ca5-5.*)"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ matrix.MacOS_TARGET }}-${{ contains(matrix.ARCH_COMMAND, 'arm64') && 'arm64' || contains(matrix.ARCH_COMMAND, 'x86_64') && 'x86_64' || '' }}-python${{ matrix.python-version }}-dist
          path: dist/*.whl
          retention-days: 1

#      - name: Run the tests
#        run: |
#          ${{ matrix.SOURCE }}
#          cd ..
#          ${{ matrix.ARCH_COMMAND }} python -m PyMca5.tests.TestAll
#
#      # run all tests for universal wheels
#      - name: Run extra arm64 tests
#        if: matrix.ARCH_COMMAND != 'arch -x86_64' && matrix.ARCH_COMMAND != 'arch -arm64'
#        run: |
#          cd ..
#          arch -arm64 python -m PyMca5.tests.TestAll
#      - name: Run extra x86 tests
#        if: matrix.ARCH_COMMAND != 'arch -x86_64' && matrix.ARCH_COMMAND != 'arch -arm64'
#        run: |
#          cd ..
#          arch -x86_64 python -m PyMca5.tests.TestAll


  build_universal:
    name: Universal wheels
    needs: build_and_test
    runs-on: macos-latest
    steps:

      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Download Mac x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-10.13-x86_64-python3.12-dist
          path: dist

      - name: Download Mac arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-11-arm64-python3.12-dist
          path: dist

      - name: list downloads
        run: ls -l dist

      - name: Install tools
        run: |
          python -m pip install --upgrade pip wheel delocate

      - name: Unzip wheels safely
        run: |
          mkdir wheel_x86 wheel_arm wheel_universal
          unzip dist/*x86_64.whl -d wheel_x86
          unzip dist/*arm64.whl -d wheel_arm
          cp -R wheel_x86/* wheel_universal/

      - name: check arch
        run: |
          lipo -info wheel_x86/PyMca5/spslut.cpython-312-darwin.so
          lipo -info wheel_arm/PyMca5/spslut.cpython-312-darwin.so

      - name: Create universal binaries
        run: |
          find wheel_x86 -name "*.so" | while read sofile; do
            base=$(basename "$sofile")
            armfile=$(find wheel_arm -name "$base" | head -n1)
            output=$(find wheel_universal -name "$base" | head -n1)
            echo "Creating universal binary for $base"
            lipo -create "$sofile" "$armfile" -output "$output"
          done

      - name: Repack wheel
        run: |
          cd wheel_universal
          python -m wheel pack . -d ../final_wheel

      - name: Fix wheel (delocate)
        run: |
          delocate-wheel -w fixed_wheel final_wheel/*.whl

      - name: Upload universal wheel
        uses: actions/upload-artifact@v4
        with:
          name: universal-wheel
          path: fixed_wheel/*.whl

      - name: Install
        run: |
          pip install --pre ./fixed_wheel/*.whl

      - name: Run extra x86 tests
        run: |
          cd ..
          arch -x86_64 python -m PyMca5.tests.TestAll

      - name: Run extra arm64 tests
        run: |
          cd ..
          arch -arm64 python -m PyMca5.tests.TestAll


