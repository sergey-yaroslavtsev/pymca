name: Update Changelog on Tag

on:
  workflow_dispatch:
  workflow_call:

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up GitHub CLI
        uses: cli/cli@v2

      - name: Extract current and previous tag
        id: tags
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$CURRENT_TAG$" | head -n 1)
          echo "current=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "previous=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog notes from merged PRs
        id: changelog
        run: |
          gh pr list --state merged --search "merged:>${{ steps.tags.outputs.previous }}" \
            --json title,number \
            --jq '.[] | "- " + (try (.title | capture("^\\[(?<tag>.*?)\\]\\s*(?<rest>.*)") | "\(.tag). \(.rest)") catch .title) + " (#\(.number))"' > changelog_notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub release notes
        run: |
          gh release edit "${{ steps.tags.outputs.current }}" \
            --notes-file changelog_notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
