#          DMG_NAME="${{ env.APP_BASE_NAME }}.dmg"
#          DMG_PATH="dist/${DMG_NAME}"
#
#          echo "Creating DMG at $DMG_PATH..."
#
#          # 1. Create temp directory
#          mkdir -p dmg_temp
#
#          # 2. Copy app bundle
#          cp -R "dist/universal/${{ env.APP_NAME }}" dmg_temp/
#
#          # 3. Strip extended attributes (mimics `xattr -cr` logic in .spec)
#          xattr -cr "dmg_temp/${{ env.APP_NAME }}"
#
#          # 4. Create compressed DMG with better options
#          hdiutil create "$DMG_PATH" \
#            -volname "${{ env.APP_BASE_NAME }}" \
#            -srcfolder "dmg_temp" \
#            -fs HFS+ \
#            -format UDZO \
#            -imagekey zlib-level=9
#
#          echo "✅ DMG created: $DMG_PATH"
#
#          # 5. Cleanup
#          rm -rf dmg_temp

      - name: Install create-dmg
        # On macOS runner you can brew install it
        run: brew install create-dmg

      - name: Create fancy compressed DMG
        run: |
          set -e

          DMG_NAME="${{ env.APP_BASE_NAME }}.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          APP_PATH="dist/universal/${{ env.APP_NAME }}"

          echo "Creating DMG at $DMG_PATH from $APP_PATH"
          
          # Check that app exists
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: .app bundle not found at $APP_PATH"
            ls -l dist/universal
            exit 1
          fi
          
          xattr -cr "$APP_PATH"
  
          # Invoke create-dmg with styling + compression
          create-dmg \
            --volname "${{ env.APP_BASE_NAME }}" \
            --format UDBZ \
            --filesystem HFS+ \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}" 200 200 \
            --app-drop-link 450 200 \
            --skip-jenkins \
            --sandbox-safe \
            --hdiutil-verbose \
            "$DMG_PATH" \
            "$(dirname "$APP_PATH")" 

          echo "✅ DMG created: $DMG_PATH"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_BASE_NAME }}-create-dmg
          path: dist/${{ env.APP_BASE_NAME }}.dmg
          retention-days: 1

