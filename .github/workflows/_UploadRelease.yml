name: Upload release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  upload_release:
    name: Upload all packages
    runs-on: ubuntu-latest
    steps:

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-sdist
          path: dist

      - name: Rename sdist to .src.tgz
        run: |
          cd dist
          old_file=$(ls pymca5-*.tar.gz)
          new_file=$(echo "$old_file" | sed 's/^pymca5-/pymca/' | sed 's/\.tar\.gz$/.src.tgz/')
          mv "$old_file" "$new_file"
          echo "Renamed $old_file → $new_file"

      - name: Download Mac universal artifact
        uses: actions/download-artifact@v4
        with:
          name: PyMca5-universal-dmg
          path: tmp

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-cxfreeze
          path: dist

      - name: List all downloaded files
        run: ls -R dist

      - name: Get latest version from TestPyPI
        id: get_version
        run: |
          PACKAGE="Pymca_release_test"
          META=$(curl -s https://test.pypi.org/pypi/$PACKAGE/json)
          VERSION=$(echo "$META" | jq -r '.info.version')
          echo "Latest version is $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
